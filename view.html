<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Noto+Sans+JP:wght@900&display=swap');

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 100px 30px;
    background: transparent;
    font-family: 'Montserrat', 'Noto Sans JP', sans-serif;
    display: flex;
    gap: 60px;
    justify-content: center;
    align-items: center;
    width: 100vw;
    overflow: hidden;
  }

  /* 横3：縦2の比率（270px × 180px） */
  .card {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, rgba(20,20,25,0.95), rgba(10,10,15,0.98));
    width: 270px;
    height: 180px;
    padding: 16px 20px 10px 20px;
    border-radius: 20px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.85);
    transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  /* P1：レッド */
  .p1-card { border: 4px solid #ff3366; }
  .p1-card .name { color: #ff5e83; }

  /* P2：ブルー */
  .p2-card { border: 4px solid #00c3ff; }
  .p2-card .name { color: #6be0ff; }

  .name {
    font-size: 26px;
    font-weight: 900;
    letter-spacing: 1px;
    margin-bottom: 2px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.9);
    max-width: 230px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-align: center;
  }

  .score {
    font-size: 88px;
    color: #ffffff;
    line-height: 1;
    font-weight: 900;
    margin-top: 4px;
    text-shadow: 0 4px 14px rgba(0,0,0,0.9);
    transition: transform 0.2s ease;
    text-align: center;
  }

  /* MATCH POINT / WINNER バッジ */
  .badge {
    position: absolute;
    top: -24px;
    left: 14px;
    right: 14px;
    padding: 6px 0;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 900;
    letter-spacing: 2.5px;
    text-align: center;
    display: none;
    text-transform: uppercase;
  }

  /* リーチ演出 */
  .reach {
    animation: reachPulse 2.4s infinite ease-in-out;
  }

  .p1-card.reach {
    box-shadow: 0 0 20px #ff2a5f, 0 0 50px rgba(255, 42, 95, 1), 0 0 85px rgba(255, 100, 150, 0.85);
    border-color: #ff5e83;
  }
  .p1-card.reach .badge {
    display: block;
    background: linear-gradient(90deg, #ff0044, #ff4d79);
    color: #ffffff;
    box-shadow: 0 0 22px #ff2a5f, 0 4px 12px rgba(0,0,0,0.5);
  }

  .p2-card.reach {
    box-shadow: 0 0 45px rgba(0, 195, 255, 0.85);
  }
  .p2-card.reach .badge {
    display: block;
    background: linear-gradient(90deg, #0099ff, #4dd2ff);
    color: #000000;
    box-shadow: 0 0 22px #00c3ff, 0 4px 12px rgba(0,0,0,0.5);
  }

  @keyframes reachPulse {
    0%, 100% {
      transform: scale(1);
      filter: brightness(1);
    }
    50% {
      transform: scale(1.03);
      filter: brightness(1.8) contrast(1.1);
    }
  }

  /* 確定演出（WINNER） */
  .win {
    animation: winExplosion 1.4s infinite alternate ease-in-out;
    z-index: 10;
  }
  .p1-card.win {
    border-color: #ffd700;
    background: linear-gradient(135deg, rgba(80, 20, 30, 0.98), rgba(20, 5, 10, 0.98));
  }
  .p2-card.win {
    border-color: #ffd700;
    background: linear-gradient(135deg, rgba(15, 45, 80, 0.98), rgba(5, 10, 20, 0.98));
  }
  .win .name {
    color: #fff2a3 !important;
  }
  .win .score {
    color: #ffffff;
    text-shadow: 0 0 20px #ffd700, 0 0 40px #ffae00;
  }
  .win .badge {
    display: block;
    background: linear-gradient(90deg, #ffb700, #ffe600, #ffb700);
    color: #000000;
    font-size: 18px;
    letter-spacing: 3px;
    box-shadow: 0 0 25px #ffd700, 0 0 50px rgba(255, 215, 0, 0.8);
  }

  @keyframes winExplosion {
    0% {
      transform: scale(1.08);
      box-shadow: 0 0 40px rgba(255, 215, 0, 0.8), 0 0 70px rgba(255, 150, 0, 0.5);
    }
    100% {
      transform: scale(1.15);
      box-shadow: 0 0 70px rgba(255, 215, 0, 1), 0 0 120px rgba(255, 230, 100, 0.9), 0 0 160px rgba(255, 100, 0, 0.6);
    }
  }

  /* 敗者側のフェードアウト */
  .loser {
    opacity: 0.35;
    transform: scale(0.92);
    filter: grayscale(60%);
  }
</style>
</head>
<body>

  <!-- P1 -->
  <div class="card p1-card" id="card-p1">
    <div class="badge" id="badge-p1">MATCH POINT</div>
    <div class="name" id="name-p1">Player 1</div>
    <div class="score" id="score-p1">0</div>
  </div>

  <!-- P2 -->
  <div class="card p2-card" id="card-p2">
    <div class="badge" id="badge-p2">MATCH POINT</div>
    <div class="name" id="name-p2">Player 2</div>
    <div class="score" id="score-p2">0</div>
  </div>

<script>
  var channel = new BroadcastChannel('custom_scoreboard_channel');

  function render(d) {
    if (!d) return;

    var nameP1 = document.getElementById('name-p1');
    var nameP2 = document.getElementById('name-p2');
    var scoreP1 = document.getElementById('score-p1');
    var scoreP2 = document.getElementById('score-p2');

    var p1Score = (typeof d.p1 === 'number') ? d.p1 : 0;
    var p2Score = (typeof d.p2 === 'number') ? d.p2 : 0;
    var target = (typeof d.target === 'number' && d.target > 0) ? d.target : 3;

    if (nameP1) nameP1.innerText = d.p1_name || 'Player 1';
    if (nameP2) nameP2.innerText = d.p2_name || 'Player 2';
    if (scoreP1) scoreP1.innerText = p1Score;
    if (scoreP2) scoreP2.innerText = p2Score;

    setState('p1', p1Score, p2Score, target);
    setState('p2', p2Score, p1Score, target);
  }

  function setState(side, score, oppScore, target) {
    var card = document.getElementById('card-' + side);
    var badge = document.getElementById('badge-' + side);
    if (!card || !badge) return;

    card.classList.remove('reach', 'win', 'loser');

    if (score >= target) {
      card.classList.add('win');
      badge.innerText = '★ WINNER ★';
    } else if (oppScore >= target) {
      card.classList.add('loser');
    } else if (score === (target - 1) && target > 1) {
      card.classList.add('reach');
      badge.innerText = 'MATCH POINT';
    }
  }

  channel.onmessage = function(e) {
    render(e.data);
  };

  window.addEventListener('storage', function(e) {
    if (e.key === 'obs_score_state' && e.newValue) {
      try {
        render(JSON.parse(e.newValue));
      } catch (err) {}
    }
  });

  try {
    var saved = localStorage.getItem('obs_score_state');
    if (saved) {
      render(JSON.parse(saved));
    }
  } catch (err) {}
</script>
</body>
</html>
