<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Noto+Sans+JP:wght@900&display=swap');

  /* 光の見切れを防ぐため上下余白を確保しつつ、中央揃えを維持 */
  body {
    margin: 0;
    padding: 90px 20px;
    background: transparent;
    font-family: 'Montserrat', 'Noto Sans JP', sans-serif;
    display: flex;
    gap: 50px;
    justify-content: center;
    align-items: center;
    width: 100vw;
    box-sizing: border-box;
    overflow: hidden;
  }

  .card {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, rgba(20,20,25,0.95), rgba(10,10,15,0.98));
    padding: 24px 36px 18px 36px;
    border-radius: 18px;
    min-width: 200px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-sizing: border-box;
  }

  /* P1：レッド */
  .p1-card { border: 4px solid #ff3366; }
  .p1-card .name { color: #ff5e83; }

  /* P2：ブルー */
  .p2-card { border: 4px solid #00c3ff; }
  .p2-card .name { color: #6be0ff; }

  .name {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: 1px;
    margin-bottom: 6px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.9);
    max-width: 200px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-align: center;
  }

  .score {
    font-size: 84px;
    color: #ffffff;
    line-height: 1;
    font-weight: 900;
    text-shadow: 0 4px 12px rgba(0,0,0,0.9);
    transition: transform 0.2s ease;
    text-align: center;
  }

  /* ★MATCH POINT / WINNER バッジ */
  .badge {
    position: absolute;
    top: -24px;
    left: 8px;
    right: 8px;
    padding: 5px 0;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 900;
    letter-spacing: 2px;
    text-align: center;
    display: none;
    box-sizing: border-box;
    text-transform: uppercase;
  }

  /* ★リーチ演出 */
  .reach {
    animation: reachPulse 2.4s infinite ease-in-out;
  }

  .p1-card.reach {
    box-shadow: 0 0 20px #ff2a5f, 0 0 50px rgba(255, 42, 95, 1), 0 0 80px rgba(255, 100, 150, 0.8);
    border-color: #ff5e83;
  }
  .p1-card.reach .badge {
    display: block;
    background: linear-gradient(90deg, #ff0044, #ff4d79);
    color: #ffffff;
    box-shadow: 0 0 20px #ff2a5f, 0 4px 10px rgba(0,0,0,0.5);
  }

  .p2-card.reach {
    box-shadow: 0 0 45px rgba(0, 195, 255, 0.85);
  }
  .p2-card.reach .badge {
    display: block;
    background: linear-gradient(90deg, #0099ff, #4dd2ff);
    color: #000000;
    box-shadow: 0 0 20px #00c3ff, 0 4px 10px rgba(0,0,0,0.5);
  }

  @keyframes reachPulse {
    0%, 100% {
      transform: scale(1);
      filter: brightness(1);
    }
    50% {
      transform: scale(1.03);
      filter: brightness(1.8) contrast(1.1);
    }
  }

  /* ★確定演出（WINNER） */
  .win {
    animation: winExplosion 1.4s infinite alternate ease-in-out;
    z-index: 10;
  }
  .p1-card.win {
    border-color: #ffd700;
    background: linear-gradient(135deg, rgba(80, 20, 30, 0.98), rgba(20, 5, 10, 0.98));
  }
  .p2-card.win {
    border-color: #ffd700;
    background: linear-gradient(135deg, rgba(15, 45, 80, 0.98), rgba(5, 10, 20, 0.98));
  }
  .win .name {
    color: #fff2a3 !important;
  }
  .win .score {
    color: #ffffff;
    text-shadow: 0 0 20px #ffd700, 0 0 40px #ffae00;
  }
  .win .badge {
    display: block;
    background: linear-gradient(90deg, #ffb700, #ffe600, #ffb700);
    color: #000000;
    font-size: 18px;
    letter-spacing: 3px;
    box-shadow: 0 0 25px #ffd700, 0 0 50px rgba(255, 215, 0, 0.8);
  }

  @keyframes winExplosion {
    0% {
      transform: scale(1.08);
      box-shadow: 0 0 40px rgba(255, 215, 0, 0.8), 0 0 70px rgba(255, 150, 0, 0.5);
    }
    100% {
      transform: scale(1.15);
      box-shadow: 0 0 70px rgba(255, 215, 0, 1), 0 0 120px rgba(255, 230, 100, 0.9), 0 0 160px rgba(255, 100, 0, 0.6);
    }
  }

  /* 敗者側のフェードアウト */
  .loser {
    opacity: 0.35;
    transform: scale(0.92);
    filter: grayscale(60%);
  }
</style>
</head>
<body>

  <!-- P1 -->
  <div class="card p1-card" id="card-p1">
    <div class="badge" id="badge-p1">MATCH POINT</div>
    <div class="name" id="name-p1">Player 1</div>
    <div class="score" id="score-p1">0</div>
  </div>

  <!-- P2 -->
  <div class="card p2-card" id="card-p2">
    <div class="badge" id="badge-p2">MATCH POINT</div>
    <div class="name" id="name-p2">Player 2</div>
    <div class="score" id="score-p2">0</div>
  </div>

<script>
  const channel = new BroadcastChannel('custom_scoreboard_channel');

  function render(d) {
    if (!d) return;
    document.getElementById('name-p1').innerText = d.p1_name || 'Player 1';
    document.getElementById('name-p2').innerText = d.p2_name || 'Player 2';
    document.getElementById('score-p1').innerText = d.p1 ?? 0;
    document.getElementById('score-p2').innerText = d.p2 ?? 0;

    setState('p1', d.p1 ?? 0, d.p2 ?? 0, d.target || 3);
    setState('p2', d.p2 ?? 0, d.p1 ?? 0, d.target || 3);
  }

  function setState(side, score, oppScore, target) {
    const card = document.getElementById('card-' + side);
    const badge = document.getElementById('badge-' + side);
    card.classList.remove('reach', 'win', 'loser');

    if (score >= target) {
      card.classList.add('win');
      badge.innerText = '★ WINNER ★';
    } else if (oppScore >= target) {
      card.classList.add('loser');
    } else if (score === target - 1 && target > 1) {
      card.classList.add('reach');
      badge.innerText = 'MATCH POINT';
    }
  }

  channel.onmessage = (e) => { render(e.data); };

  window.addEventListener('storage', (e) => {
    if (e.key === 'obs_score_state') render(JSON.parse(e.newValue));
  });

  const saved = localStorage.getItem('obs_score_state');
  if (saved) render(JSON.parse(saved));
</script>
</body>
</html>
